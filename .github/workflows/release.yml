name: Auto Release on Version Bump

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Extract Version from version.py
        id: get_version
        shell: pwsh
        run: |
          if (Test-Path "version.py") {
            $ver = (Get-Content "version.py" | Select-String 'VERSION\s*=\s*["'']([^"'']+)["'']').Matches.Groups[1].Value
          } else {
            $ver = "1.0.0"
          }
          Write-Host "Detected project version: $ver"
          echo "CURRENT_VERSION=$ver" >> $env:GITHUB_ENV
          echo "TAG_NAME=v$ver" >> $env:GITHUB_ENV

      - name: Check if Release / Tag already exists
        id: check_tag
        shell: pwsh
        run: |
          $tag = $env:TAG_NAME
          $tagExists = git tag -l $tag
          if ($tagExists) {
            Write-Host "Tag $tag already exists. Skipping build and release."
            echo "SHOULD_RELEASE=false" >> $env:GITHUB_ENV
          } else {
            Write-Host "New version detected ($tag)! Proceeding with build and release."
            echo "SHOULD_RELEASE=true" >> $env:GITHUB_ENV
          }

      - name: Install Build Dependencies
        if: env.SHOULD_RELEASE == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install pyinstaller

      - name: Prepare Version Info for Executable
        if: env.SHOULD_RELEASE == 'true'
        shell: pwsh
        run: |
          $ver = $env:CURRENT_VERSION
          $verComma = $ver -replace '\.', ','
          (Get-Content 'version_info.txt.template') -replace '{VER_STR}', $ver -replace '{VER_COMMA}', $verComma | Set-Content 'version_info.txt' -Encoding utf8

      - name: Compile Jarvis Executable via PyInstaller
        if: env.SHOULD_RELEASE == 'true'
        run: |
          pyinstaller jarvis.spec --noconfirm

      - name: Compress Release Package into Portable ZIP
        if: env.SHOULD_RELEASE == 'true'
        shell: pwsh
        run: |
          $ver = $env:CURRENT_VERSION
          $zipName = "JarvisAI-$ver-Windows-x64.zip"
          Compress-Archive -Path "dist\JarvisAI\*" -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        if: env.SHOULD_RELEASE == 'true'
        run: |
          choco install innosetup --no-progress -y

      - name: Build Windows Installer (Setup.exe)
        if: env.SHOULD_RELEASE == 'true'
        shell: pwsh
        run: |
          $ver = $env:CURRENT_VERSION
          $installerName = "JarvisAI-$ver-Setup.exe"
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" /DMyAppVersion="$ver" installer.iss
          if (Test-Path "dist-installer\$installerName") {
            Write-Host "Installer created successfully: dist-installer\$installerName"
            echo "INSTALLER_PATH=dist-installer\$installerName" >> $env:GITHUB_ENV
          } else {
            Write-Error "Installer file not found!"
            exit 1
          }

      - name: Create GitHub Release and Upload Binaries
        if: env.SHOULD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Jarvis AI ${{ env.TAG_NAME }}"
          body: |
            ## 🚀 Jarvis AI Release ${{ env.TAG_NAME }}
            
            Assistente virtual pessoal offline para Windows 64-bit.
            
            ### 📥 Opções de Download:
            1. **Instalador Oficial (`.exe`)**:
               - Baixe o instalador `JarvisAI-${{ env.CURRENT_VERSION }}-Setup.exe` para instalar o Jarvis no seu sistema com atalho na Área de Trabalho e inicialização com o Windows (opcional).
            2. **Versão Portátil (`.zip`)**:
               - Baixe o `JarvisAI-${{ env.CURRENT_VERSION }}-Windows-x64.zip`, extraia em qualquer pasta e execute diretamente sem instalação.
            
            ### 📦 O que está incluído:
            - Executável nativo `JarvisAI.exe` pré-compilado (dispensa instalação prévia de Python).
            - Servidor de ferramentas de hardware integrado via MCP (Bluetooth, Volume, Bateria, Apps).
            - Reconhecimento de fala Whisper local e síntese neural Edge-TTS.
            - Download automático transparente do modelo local GGUF e pesos Whisper na primeira inicialização com feedback por voz.
            
            ### 💻 Como usar:
            - Execute o instalador ou abra `JarvisAI.exe`.
            - Pressione `Ctrl + Alt + J` para conversar com o Jarvis.
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.INSTALLER_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
